name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'hermes-android-bridge/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'hermes-android-bridge/**'
  workflow_dispatch:  # Manual trigger

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Clone hermes-android bridge source
      run: |
        git clone --depth 1 https://github.com/raulvidis/hermes-android.git /tmp/hermes-android-src
        mkdir -p hermes-android-bridge
        cp -r /tmp/hermes-android-src/hermes-android-bridge/* hermes-android-bridge/
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Make gradlew executable
      working-directory: ./hermes-android-bridge
      run: chmod +x gradlew
      
    - name: Build APK
      working-directory: ./hermes-android-bridge
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: hermes-android-bridge/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
    - name: Create Release (on main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.run_number }}
        release_name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        
    - name: Upload Release Asset (on main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: hermes-android-bridge/app/build/outputs/apk/debug/app-debug.apk
        asset_name: hermes-android-bridge.apk
        asset_content_type: application/vnd.android.package-archive
